<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversion Receipt Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f5f5;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .editor-section {
      background: #fff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .editor-section h2 {
      font-size: 22px;
      font-weight: 700;
      color: #000;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      background: #fff;
      border-color: #4d5ed3;
      box-shadow: 0 0 0 2px rgba(77, 94, 211, 0.1);
    }

    .form-group select {
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #4d5ed3;
      color: #fff;
      border-color: #4d5ed3;
    }

    .btn-primary:hover {
      background: #3d4ec0;
      border-color: #3d4ec0;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border-color: #ddd;
    }

    .btn-secondary:hover {
      background: #e5e5e5;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
    }

    .preview-section h2 {
      font-size: 22px;
      font-weight: 700;
      color: #000;
      margin-bottom: 24px;
    }

    .preview-frame {
      flex: 1;
      background: #fafaf9;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 800px;
      padding: 30px 20px;
    }

    .receipt-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: #fafaf9;
      border-radius: 10px;
      overflow: hidden;
      padding: 24px 22px 20px;
    }

    .watermark {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('./watermark.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 50% auto;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .receipt-content {
      position: relative;
      z-index: 1;
    }

    .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .receipt-title {
      font-size: 32px;
      font-weight: 800;
      color: #000;
      line-height: 1;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #999;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .amount-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .amount-display {
      font-size: 28px;
      font-weight: 800;
      color: #000;
      line-height: 1;
      letter-spacing: -0.8px;
    }

    .currency-text {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #000;
      margin: 0 0 14px 0;
      letter-spacing: -0.3px;
    }

    .account-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .account-label {
      flex: 0.45;
      background: #f0f1ff;
      border: 1.5px solid #8899ff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #5566cc;
      display: flex;
      align-items: center;
    }

    .account-value {
      flex: 0.55;
      background: #efefef;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
    }

    .details-table {
      position: relative;
      background: rgba(200, 200, 200, 0.08);
      border-radius: 14px;
      padding: 10px 0;
      margin-top: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }

    .detail-value {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      text-align: right;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      background: #dff3e5;
      color: #38a95d;
    }

    .status-badge.failed {
      background: #f5dfe2;
      color: #d04a4a;
    }

    .status-badge.pending {
      background: #f0e9b8;
      color: #d0a521;
    }

    .account-name {
      color: #4d5ed3;
      font-weight: 700;
      text-decoration: underline;
      font-size: 14px;
    }

    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 1fr;
      }

      .preview-frame {
        min-height: 600px;
      }
    }

    @media (max-width: 640px) {
      .editor-section,
      .preview-section {
        padding: 20px;
      }

      .receipt-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Editor Section -->
    <div class="editor-section">
      <h2>Edit Template</h2>

      <div class="form-group">
        <label>Conversion Amount</label>
        <input type="text" id="conversionAmount" value="3.55" placeholder="3.55" />
      </div>

      <div class="form-group">
        <label>Account Number</label>
        <input type="text" id="accountNumber" value="8105866469" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="status">
          <option value="Successful">Successful</option>
          <option value="Failed">Failed</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <div class="form-group">
        <label>Amount ($)</label>
        <input type="text" id="amount" value="3.30" />
      </div>

      <div class="form-group">
        <label>Total Fee ($)</label>
        <input type="text" id="fee" value="0.25" />
      </div>

      <div class="form-group">
        <label>Exchange Rate</label>
        <input type="text" id="exchangeRate" value="₦1,380" placeholder="₦1,380" />
      </div>

      <div class="form-group">
        <label>Date & Time</label>
        <input type="text" id="dateTime" value="Jul 05 2026, 12:01PM" />
      </div>

      <div class="form-group">
        <label>Account Name</label>
        <input type="text" id="accountName" value="Emmanuel Ekpa" />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phoneNumber" value="+234 803 456 7890" />
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="previewBtn">Preview Update</button>
        <button class="btn btn-secondary" id="copyBtn">Copy Template</button>
      </div>
    </div>

    <!-- Preview Section -->
    <div class="preview-section">
      <h2>Template Preview</h2>
      <div class="preview-frame" id="previewFrame">
        <div class="receipt-card" id="receiptCard">
          <div class="watermark"></div>
          <div class="receipt-content">
            <div class="receipt-header">
              <h1 class="receipt-title">Conversion</h1>
              <button class="close-btn">×</button>
            </div>

            <div class="amount-section">
              <div class="amount-display">−$<span id="previewAmount">3.55</span></div>
              <div class="currency-text">
                <span>🇺🇸</span>
                <span>E-wallet</span>
                <span style="font-size: 12px;">→</span>
                <span>🇳🇬</span>
                <span>NGN</span>
              </div>
            </div>

            <h2 class="section-title">Transaction details</h2>

            <div class="account-row">
              <div class="account-label">Account Number</div>
              <div class="account-value" id="previewAccountNumber">8105866469</div>
            </div>

            <div class="details-table">
              <div class="detail-row">
                <div class="detail-label">Status</div>
                <div class="detail-value">
                  <span class="status-badge" id="previewStatus">Successful</span>
                </div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Amount</div>
                <div class="detail-value">$<span id="previewAmountValue">3.30</span></div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Total fee</div>
                <div class="detail-value">$<span id="previewFee">0.25</span></div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Exchange rate</div>
                <div class="detail-value">$1 = <span id="previewExchangeRate">₦1,380</span></div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Date & Time</div>
                <div class="detail-value" id="previewDateTime">Jul 05 2026, 12:01PM</div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Account Name</div>
                <div class="detail-value account-name" id="previewAccountName">Emmanuel Ekpa</div>
              </div>

              <div class="detail-row">
                <div class="detail-label">Phone Number</div>
                <div class="detail-value" id="previewPhoneNumber">+234 803 456 7890</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      document.getElementById('previewAmount').textContent = document.getElementById('conversionAmount').value;
      document.getElementById('previewAccountNumber').textContent = document.getElementById('accountNumber').value;
      document.getElementById('previewAmountValue').textContent = document.getElementById('amount').value;
      document.getElementById('previewFee').textContent = document.getElementById('fee').value;
      document.getElementById('previewExchangeRate').textContent = document.getElementById('exchangeRate').value;
      document.getElementById('previewDateTime').textContent = document.getElementById('dateTime').value;
      document.getElementById('previewAccountName').textContent = document.getElementById('accountName').value;
      document.getElementById('previewPhoneNumber').textContent = document.getElementById('phoneNumber').value;

      const statusValue = document.getElementById('status').value;
      const statusBadge = document.getElementById('previewStatus');
      statusBadge.textContent = statusValue;
      statusBadge.className = 'status-badge';
      if (statusValue === 'Failed') {
        statusBadge.classList.add('failed');
      } else if (statusValue === 'Pending') {
        statusBadge.classList.add('pending');
      }
    }

    document.getElementById('previewBtn').addEventListener('click', updatePreview);

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const receiptHTML = document.getElementById('receiptCard').outerHTML;
      try {
        await navigator.clipboard.writeText(receiptHTML);
        const btn = document.getElementById('copyBtn');
        const oldText = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = oldText, 2000);
      } catch (err) {
        alert('Failed to copy. Please try again.');
      }
    });

    // Initial preview
    updatePreview();
  </script>
</body>
</html>
